<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Room Booking</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #e3f2fd;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .screen {
      background: white;
      border: 10px solid #4caf50;
      width: 800px;
      height: 500px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      padding: 40px;
      box-sizing: border-box;
      position: relative;
    }
    .brand {
      font-weight: bold;
      font-size: 20px;
      color: #000;
    }
    .title {
      font-size: 36px;
      margin: 10px 0;
    }
    .time {
      position: absolute;
      right: 40px;
      top: 40px;
      font-size: 24px;
      color: #333;
    }
    .quick-book {
      display: block;
      margin: 40px auto 20px;
      padding: 15px 30px;
      font-size: 20px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 40px;
      cursor: pointer;
    }
    .time-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .time-buttons button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background-color: #eee;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .time-buttons button:hover {
      background-color: #ccc;
    }
    .language-switch {
      position: absolute;
      left: 40px;
      top: 200px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="brand">PERSONA</div>
    <div class="title" id="room-title">Meeting Room-A01</div>
    <div class="time" id="current-time"></div>

    <button class="quick-book" id="quick-book-btn" onclick="window.location.href='book.html'">QUICK BOOKING</button>

    <div class="time-buttons">
      <button id="btn30" onclick="bookTime(30)">30 Mins</button>
      <button id="btn60" onclick="bookTime(60)">60 Mins</button>
      <button id="btn90" onclick="bookTime(90)">90 Mins</button>
      <button id="btn120" onclick="bookTime(120)">120 Mins</button>
    </div>

    <div class="language-switch">
      <button onclick="setLang('en')">English</button>
      <button onclick="setLang('zh')">中文</button>
      <button onclick="setLang('jp')">日本語</button>
    </div>
  </div>

  <script>
    const translations = {
      en: {
        title: 'Meeting Room-A01',
        quick: 'QUICK BOOKING',
        btn30: '30 Mins',
        btn60: '60 Mins',
        btn90: '90 Mins',
        btn120: '120 Mins'
      },
      zh: {
        title: '會議室-A01',
        quick: '快速預約',
        btn30: '30分鐘',
        btn60: '60分鐘',
        btn90: '90分鐘',
        btn120: '120分鐘'
      },
      jp: {
        title: '会議室-A01',
        quick: 'クイック予約',
        btn30: '30分',
        btn60: '60分',
        btn90: '90分',
        btn120: '120分'
      }
    };

    function setLang(lang) {
      const t = translations[lang];
      document.getElementById('room-title').innerText = t.title;
      document.getElementById('quick-book-btn').innerText = t.quick;
      document.getElementById('btn30').innerText = t.btn30;
      document.getElementById('btn60').innerText = t.btn60;
      document.getElementById('btn90').innerText = t.btn90;
      document.getElementById('btn120').innerText = t.btn120;
    }

    function updateTime() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById("current-time").textContent = `${hours}:${minutes}`;
    }

    function bookTime(minutes) {
      window.location.href='book.html';
    }

    setInterval(updateTime, 1000);
    updateTime();
  </script>
</body>
</html>

</body>
</html>
